name: Pakistan News Cloud Auto-Poster & X Watcher

on:
  schedule:
    # Run every 15 minutes automatically on GitHub cloud
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-post-to-x:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit database updates back to the repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Use the built-in GITHUB_TOKEN with write access
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history to avoid push conflicts
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure X (Twitter) Credentials from GitHub Secrets
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python -c "
          import json, os
          config = {
              'hashtags': '#Pakistan #PakistanNews #LatestNews',
              'twitter': {
                  'enabled': True,
                  'api_key': os.getenv('TWITTER_API_KEY', ''),
                  'api_secret': os.getenv('TWITTER_API_SECRET', ''),
                  'access_token': os.getenv('TWITTER_ACCESS_TOKEN', ''),
                  'access_token_secret': os.getenv('TWITTER_ACCESS_TOKEN_SECRET', '')
              }
          }
          with open('config.json', 'w') as f:
              json.dump(config, f, indent=2)
          "

      - name: Fetch Latest News, Videos & Opinions
        run: |
          python main.py fetch
          python main.py stats

      - name: Auto-Post New Stories to X (Twitter)
        run: |
          python main.py post --channel twitter --limit 3 || true

      - name: Export Static Database for GitHub Pages
        run: |
          mkdir -p static
          python main.py export --format json --output static/latest_news.json

      - name: Commit and Push Database Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news_database.db static/latest_news.json
          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update: news database & static JSON"
            # Pull with rebase to handle any concurrent updates, then push
            git pull --rebase origin main
            git push origin main
            echo "Successfully pushed database updates."
          fi
